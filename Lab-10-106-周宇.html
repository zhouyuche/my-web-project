<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>三行自动变向轮播图</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            padding: 20px;
            background: #f5f5f5;
        }

        /* 每行容器 */
        .carousel-row {
            margin-bottom: 40px;
        }

        /* 主题标题 */
        .carousel-title {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #333;
            text-align: center;
        }

        /* 轮播外框 —— 一次显示3张 */
        .carousel-container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            overflow: hidden;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        /* 轮播轨道 */
        .carousel-track {
            display: flex;
            transition: transform 0.5s ease;
        }

        /* 单张图片 */
        .carousel-item {
            flex: 0 0 calc(100% / 3);
            padding: 5px;
        }

        .carousel-item img {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-radius: 6px;
            display: block;
        }
    </style>
</head>
<body>

    <!-- ===================== 第一行 ===================== -->
    <div class="carousel-row">
        <div class="carousel-title">第一行：风景主题</div>
        <div class="carousel-container" id="c1">
            <div class="carousel-track">
                <div class="carousel-item"><img src="https://picsum.photos/600/220?random=1"></div>
                <div class="carousel-item"><img src="https://picsum.photos/600/220?random=2"></div>
                <div class="carousel-item"><img src="https://picsum.photos/600/220?random=3"></div>
                <div class="carousel-item"><img src="https://picsum.photos/600/220?random=4"></div>
                <div class="carousel-item"><img src="https://picsum.photos/600/220?random=5"></div>
                <div class="carousel-item"><img src="https://picsum.photos/600/220?random=6"></div>
            </div>
        </div>
    </div>

    <!-- ===================== 第二行 ===================== -->
    <div class="carousel-row">
        <div class="carousel-title">第二行：城市主题</div>
        <div class="carousel-container" id="c2">
            <div class="carousel-track">
                <div class="carousel-item"><img src="https://picsum.photos/600/220?random=10"></div>
                <div class="carousel-item"><img src="https://picsum.photos/600/220?random=11"></div>
                <div class="carousel-item"><img src="https://picsum.photos/600/220?random=12"></div>
                <div class="carousel-item"><img src="https://picsum.photos/600/220?random=13"></div>
                <div class="carousel-item"><img src="https://picsum.photos/600/220?random=14"></div>
                <div class="carousel-item"><img src="https://picsum.photos/600/220?random=15"></div>
            </div>
        </div>
    </div>

    <!-- ===================== 第三行 ===================== -->
    <div class="carousel-row">
        <div class="carousel-title">第三行：科技主题</div>
        <div class="carousel-container" id="c3">
            <div class="carousel-track">
                <div class="carousel-item"><img src="https://picsum.photos/600/220?random=20"></div>
                <div class="carousel-item"><img src="https://picsum.photos/600/220?random=21"></div>
                <div class="carousel-item"><img src="https://picsum.photos/600/220?random=22"></div>
                <div class="carousel-item"><img src="https://picsum.photos/600/220?random=23"></div>
                <div class="carousel-item"><img src="https://picsum.photos/600/220?random=24"></div>
                <div class="carousel-item"><img src="https://picsum.photos/600/220?random=25"></div>
            </div>
        </div>
    </div>

    <script>
        // 每个轮播一次显示3张
        const visibleCount = 3;
        // 初始方向：1=左→右，-1=右→左
        let direction = 1;

        // 初始化所有轮播
        function initCarousel(id) {
            const container = document.getElementById(id);
            const track = container.querySelector('.carousel-track');
            const items = container.querySelectorAll('.carousel-item');
            const total = items.length;

            let index = 0;

            // 自动滚动
            function move() {
                index += direction;

                // 边界限制
                if (index < 0) index = 0;
                if (index > total - visibleCount) index = total - visibleCount;

                // 移动
                const movePercent = (100 / total) * index;
                track.style.transform = `translateX(-${movePercent}%)`;
            }

            // 每2秒移动一格（流畅滚动）
            setInterval(move, 2000);
        }

        // 启动3个轮播
        initCarousel('c1');
        initCarousel('c2');
        initCarousel('c3');

        // 每30秒切换一次方向
        setInterval(() => {
            direction = -direction;
        }, 30000);

    </script>
</body>
</html>
