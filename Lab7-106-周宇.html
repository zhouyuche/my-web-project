<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>个人信息登记表</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", sans-serif;
        }

        body {
            background-color: #f4f7fc;
            padding: 30px 20px;
        }

        .container {
            width: 95%;
            max-width: 1200px;
            margin: 0 auto;
            background: #ffffff;
            padding: 40px 50px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.06);
            position: relative;
        }

        .title {
            text-align: center;
            font-size: 30px;
            font-weight: bold;
            color: #222;
            margin-bottom: 40px;
            border-bottom: 2px solid #409eff;
            padding-bottom: 15px;
            width: 80%;
            margin-left: auto;
            margin-right: auto;
        }

        /* 右上角照片区域 */
        .photo-section {
            position: absolute;
            top: 50px;
            right: 50px;
            width: 180px;
            text-align: center;
        }

        .photo-box {
            width: 170px;
            height: 220px;
            border: 1px solid #dcdfe6;
            border-radius: 8px;
            background: #f9f9f9;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 10px;
            overflow: hidden;
        }

        .photo-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .photo-section input[type="file"] {
            font-size: 13px;
            width: 100%;
        }

        /* 表单主体：给照片留空间 */
        .form-main {
            margin-right: 220px;
        }

        /* 三列布局 */
        .row-3col {
            display: flex;
            width: 100%;
            gap: 20px;
            margin-bottom: 22px;
        }

        .form-item {
            display: flex;
            align-items: center;
            flex: 1;
            min-width: 260px;
        }

        /* 标签样式 */
        .form-item label {
            width: 115px;
            height: 42px;
            line-height: 42px;
            background-color: #f2f3f5;
            border: 1px solid #dcdfe6;
            border-radius: 6px 0 0 6px;
            font-weight: 500;
            text-align: center;
            color: #333;
            flex-shrink: 0;
        }

        /* 输入框 */
        .form-item input,
        .form-item select {
            flex: 1;
            height: 42px;
            border: 1px solid #dcdfe6;
            border-left: none;
            border-radius: 0 6px 6px 0;
            padding: 0 12px;
            font-size: 15px;
            color: #333;
            background: #fff;
            transition: 0.2s;
        }

        .form-item input:focus,
        .form-item select:focus {
            outline: none;
            border-color: #409eff;
        }

        /* 多行文本 */
        .form-item textarea {
            flex: 1;
            min-height: 110px;
            border: 1px solid #dcdfe6;
            border-left: none;
            border-radius: 0 6px 6px 0;
            padding: 12px;
            font-size: 15px;
            resize: vertical;
        }

        /* 按钮 */
        .btn-group {
            text-align: center;
            margin-top: 45px;
        }

        .btn-group button {
            padding: 12px 45px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin: 0 15px;
            transition: 0.2s;
        }

        .btn-submit {
            background-color: #409eff;
            color: #fff;
        }

        .btn-submit:hover {
            background-color: #2a89e8;
        }

        .btn-reset {
            background-color: #909399;
            color: #fff;
        }

        .btn-reset:hover {
            background-color: #7b7e84;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="title">个人信息登记表</h1>

        <div class="photo-section">
            <div class="photo-box">
                <img src="photos.jpg" alt="证件照">
            </div>
            <input type="file" name="photo" accept="image/*">
        </div>

        <form action="#" method="post" class="form-main">
            <!-- 基本信息 -->
            <div class="row-3col">
                <div class="form-item">
                    <label>姓名</label>
                    <input type="text" name="name" placeholder="请输入姓名" required>
                </div>
                <div class="form-item">
                    <label>性别</label>
                    <select name="gender">
                        <option value="">请选择</option>
                        <option value="男">男</option>
                        <option value="女">女</option>
                    </select>
                </div>
                <div class="form-item">
                    <label>年龄</label>
                    <input type="number" name="age" placeholder="请输入年龄" required>
                </div>
            </div>

            <div class="row-3col">
                <div class="form-item">
                    <label>民族</label>
                    <input type="text" name="nation" placeholder="请输入民族">
                </div>
                <div class="form-item">
                    <label>联系电话</label>
                    <input type="tel" name="phone" placeholder="请输入手机号" required>
                </div>
                <div class="form-item">
                    <label>电子邮箱</label>
                    <input type="email" name="email" placeholder="请输入邮箱" required>
                </div>
            </div>

            <div class="row-3col">
                <div class="form-item">
                    <label>学历</label>
                    <select name="education">
                        <option value="">请选择</option>
                        <option value="高中">高中</option>
                        <option value="专科">专科</option>
                        <option value="本科">本科</option>
                        <option value="硕士">硕士</option>
                        <option value="博士">博士</option>
                    </select>
                </div>
                <div class="form-item">
                    <label>专业</label>
                    <input type="text" name="major" placeholder="请输入所学专业">
                </div>
                <div class="form-item">
                    <label>毕业院校</label>
                    <input type="text" name="school" placeholder="请输入毕业院校">
                </div>
            </div>

            <div class="row-3col">
                <div class="form-item">
                    <label>健康状况</label>
                    <input type="text" name="health" placeholder="如：健康/良好">
                </div>
                <div class="form-item">
                    <label>婚姻状况</label>
                    <select name="marry">
                        <option value="">请选择</option>
                        <option value="未婚">未婚</option>
                        <option value="已婚">已婚</option>
                    </select>
                </div>
                <div class="form-item">
                    <label>求职意向</label>
                    <input type="text" name="job" placeholder="请输入求职岗位">
                </div>
            </div>

            <!-- 详细信息 -->
            <div class="form-item">
                <label>技能证书</label>
                <input type="text" name="cert" placeholder="如：英语四级、计算机二级等">
            </div>

            <div class="form-item">
                <label>特长爱好</label>
                <textarea name="hobby" placeholder="请描述个人特长与兴趣爱好"></textarea>
            </div>

            <div class="form-item">
                <label>项目经历</label>
                <textarea name="project" placeholder="请填写参与过的项目或实践经历"></textarea>
            </div>

            <div class="form-item">
                <label>自我评价</label>
                <textarea name="self" placeholder="请简单介绍自己"></textarea>
            </div>

            <!-- 按钮 -->
            <div class="btn-group">
                <button type="submit" class="btn-submit">确认提交</button>
                <button type="reset" class="btn-reset">清空重置</button>
            </div>
        </form>
    </div>
</body>
</html>
